version: 2

models:
  - name: stg_orders
    description: >
      Cleaned orders table. One row per order. Timestamps parsed, delivery
      duration calculated, and on-time flag added.
    columns:
      - name: order_id
        description: Unique order identifier
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to stg_customers
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        description: Current status of the order
        tests:
          - not_null
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled', 'unavailable',
                       'processing', 'approved', 'invoiced', 'created']
      - name: purchased_at
        tests:
          - not_null

  - name: stg_customers
    description: >
      Cleaned customers table. Note: one customer_unique_id can appear
      multiple times (once per order) with different customer_ids.
    columns:
      - name: customer_id
        description: Order-level customer ID (not truly unique per person)
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: True unique identifier per person
        tests:
          - not_null
      - name: state_code
        tests:
          - not_null

  - name: stg_products
    description: Cleaned products with normalized category names.
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: category_name
        tests:
          - not_null

  - name: stg_payments
    description: >
      Cleaned payments. One order can have multiple payment rows
      (split payments, installments).
    columns:
      - name: order_id
        tests:
          - not_null
      - name: payment_type
        tests:
          - not_null
          - accepted_values:
              values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']
      - name: payment_amount_usd
        tests:
          - not_null

  - name: stg_order_items
    description: >
      Cleaned order items. One row per product per order.
      An order with 3 products has 3 rows.
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: item_price_usd
        tests:
          - not_null
